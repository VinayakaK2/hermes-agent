services:
  - type: web
    name: hermes-agent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: HERMES_DASHBOARD
        value: "true"
      - key: HERMES_DASHBOARD_HOST
        value: "0.0.0.0"
      - key: HERMES_DASHBOARD_PORT
        value: "8000"
      - key: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
        value: "admin"
      - key: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
        value: "5002112A"
      - key: HF_DATASET_ID
        value: "VinayakaK/hermes-storage"
      - key: HF_TOKEN
        sync: false
      - key: E2B_API_KEY
        sync: false
